name: p5.js CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'fix/**'
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Verify runnable gallery
        run: test -f index.html && test -f styles.css && test -f gallery.js && grep -q 'gallery.js' index.html
